<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zahra Gonsalves — Enter the Archives</title>
<meta name="description" content="The personal and professional site of Zahra Gonsalves — historian, aspiring research librarian, and student of archives and museums.">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/door.css">
</head>
<body class="door-body">

<a class="skip-link" href="#door-trigger">Skip to entrance</a>
<div class="grain" aria-hidden="true"></div>

<main class="door-scene" id="door-scene">

  <div class="door-heading">
    <p class="door-name-script">Zahra Gonsalves</p>
    <p class="door-site-title">The Time Traveler's Archive</p>
    <h1 class="door-title">Enter the Archives</h1>
  </div>

  <a class="door-trigger" id="door-trigger" href="home.html" aria-label="Enter the archives — go to the homepage">
    <div class="door-stage">
      <div class="door-glow" aria-hidden="true"></div>
      <div class="door-shadow" aria-hidden="true"></div>
      <img class="door-img door-img--closed" src="assets/images/door/door-closed.png" alt="An ornate arched wooden door, closed.">
      <img class="door-img door-img--open" src="assets/images/door/door-open.png" alt="" aria-hidden="true">
    </div>
  </a>

  <div class="door-cta">
    <span class="door-cta__label">Push to enter</span>
  </div>
</main>

<script src="js/door.js"></script>
</body>
</html>
